name: Build Rahat-AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Rahat-AI-source.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Rahat-AI.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rahat-AI build ${{ github.run_number }}
          files: Rahat-AI.apk
